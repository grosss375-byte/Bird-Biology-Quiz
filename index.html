<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Practice identifying 20 North American birds by their calls and songs." />
<meta name="theme-color" content="#2f5d2f" />
<title>Bird Biology Sound Quiz</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%A6%3C/text%3E%3C/svg%3E" />
<style>
    :root {
        --bg: #eef5ea;
        --surface: #ffffff;
        --ink: #1a1a1a;
        --ink-muted: #4a4a4a;
        --brand: #2f5d2f;
        --brand-strong: #234823;
        --brand-soft: #e3efdd;
        --accent: #c5e1b6;
        --correct: #1a7a3a;
        --wrong: #b3261e;
        --focus: #0b6cff;
        --shadow: 0 6px 24px rgba(20, 50, 20, 0.12);
        --radius: 14px;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #e2efdb 100%);
        margin: 0;
        padding: 24px 16px 48px;
        color: var(--ink);
        line-height: 1.5;
    }

    main {
        max-width: 860px;
        margin: 0 auto;
    }

    .game-box {
        background: var(--surface);
        padding: 28px 28px 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
    }

    h1 {
        text-align: center;
        color: var(--brand);
        margin: 0 0 6px;
        font-size: clamp(24px, 4vw, 32px);
    }

    .subtitle {
        text-align: center;
        color: var(--ink-muted);
        margin: 0 0 24px;
        font-size: 15px;
    }

    .counter {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        background: var(--brand-soft);
        padding: 12px 16px;
        border-radius: 10px;
        font-weight: 600;
        margin-bottom: 18px;
    }

    .counter .score {
        color: var(--brand-strong);
    }

    .progress {
        height: 8px;
        background: var(--brand-soft);
        border-radius: 999px;
        overflow: hidden;
        margin-bottom: 22px;
    }

    .progress-fill {
        height: 100%;
        background: var(--brand);
        width: 0%;
        transition: width 200ms ease;
    }

    .button-row {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin: 12px 0;
    }

    button {
        background: var(--brand);
        color: white;
        border: 2px solid transparent;
        padding: 12px 18px;
        border-radius: 10px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        min-height: 44px;
        min-width: 44px;
    }

    button:hover { background: var(--brand-strong); }

    button:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 2px;
    }

    button.secondary {
        background: white;
        color: var(--brand-strong);
        border-color: var(--brand);
    }

    button.secondary:hover {
        background: var(--brand-soft);
    }

    label.answer-label {
        display: block;
        font-weight: 600;
        margin: 22px 0 6px;
    }

    input[type="text"] {
        width: 100%;
        padding: 14px;
        font-size: 18px;
        border-radius: 10px;
        border: 1px solid #9aa39a;
        background: white;
        color: var(--ink);
    }

    input[type="text"]:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 1px;
        border-color: var(--brand);
    }

    .result {
        margin-top: 18px;
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        min-height: 1.5em;
    }

    .result.correct { color: var(--correct); }
    .result.wrong   { color: var(--wrong); }

    .bird-list {
        margin-top: 36px;
        padding-top: 22px;
        border-top: 1px solid #d6e3d1;
    }

    .bird-list h2 {
        color: var(--brand-strong);
        font-size: 20px;
        margin: 0 0 12px;
    }

    .bird-list ul {
        columns: 2;
        margin: 0;
        padding-left: 20px;
        color: var(--ink-muted);
    }

    .bird-list li { break-inside: avoid; margin: 2px 0; }

    .sr-only {
        position: absolute;
        width: 1px; height: 1px;
        padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0);
        white-space: nowrap; border: 0;
    }

    footer {
        text-align: center;
        margin-top: 24px;
        font-size: 13px;
        color: var(--ink-muted);
    }

    @media (max-width: 480px) {
        .bird-list ul { columns: 1; }
        .game-box { padding: 20px 18px; }
    }

    @media (prefers-reduced-motion: reduce) {
        .progress-fill { transition: none; }
    }
</style>
</head>
<body>

<main>
<div class="game-box">

    <h1>Bird Biology Sound Quiz</h1>
    <p class="subtitle">20 North American bird calls. Order is randomized each visit.</p>

    <div class="counter">
        <span id="birdCounter" aria-live="polite" aria-atomic="true">Bird 1 of 20</span>
        <span class="score" id="score" aria-live="polite" aria-atomic="true">Score: 0 / 0</span>
    </div>

    <div class="progress" aria-hidden="true">
        <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="button-row" role="group" aria-label="Audio controls">
        <button type="button" id="playBtn" onclick="playSound()"><span aria-hidden="true">▶</span> Play sound</button>
        <button type="button" class="secondary" onclick="pauseSound()"><span aria-hidden="true">⏸</span> Pause</button>
        <button type="button" class="secondary" onclick="restartSound()"><span aria-hidden="true">🔁</span> Restart</button>
    </div>

    <label class="answer-label" for="answerInput">Your answer</label>
    <input
        type="text"
        id="answerInput"
        placeholder="Type the bird's name..."
        autocomplete="off"
        autocapitalize="words"
        spellcheck="false"
        aria-describedby="answerHelp"
    />
    <span id="answerHelp" class="sr-only">Press Enter to submit your answer.</span>

    <div class="button-row">
        <button type="button" onclick="checkAnswer()"><span aria-hidden="true">✅</span> Submit answer</button>
        <button type="button" class="secondary" onclick="nextBird()"><span aria-hidden="true">➡</span> Next bird</button>
    </div>

    <div class="result" id="result" role="status" aria-live="polite" aria-atomic="true"></div>

    <div class="bird-list">
        <h2>Birds included</h2>
        <ul id="birdList"></ul>
    </div>

</div>

<footer>Built for biology practice • <a href="https://vercel.com" style="color:var(--brand-strong)">Hosted on Vercel</a></footer>
</main>

<script>
const BIRDS = [
    { name: "Canada Goose",            sound: "audio/Canada_Goose.mp3" },
    { name: "Blue Jay",                sound: "audio/Blue_Jay.mp3" },
    { name: "Mallard",                 sound: "audio/Mallard.mp3" },
    { name: "Black-capped Chickadee",  sound: "audio/Black-capped_Chickadee.mp3" },
    { name: "White-breasted Nuthatch", sound: "audio/White-Breasted_Nuthatch.mp3" },
    { name: "American Robin",          sound: "audio/American_Robin.mp3" },
    { name: "Mourning Dove",           sound: "audio/Mourning_Dove.mp3" },
    { name: "Red-bellied Woodpecker",  sound: "audio/Red-bellied_Woodpecker.mp3" },
    { name: "Northern Cardinal",       sound: "audio/Northern_Cardinal.mp3" },
    { name: "Eastern Phoebe",          sound: "audio/Eastern_Phoebe.mp3" },
    { name: "Yellow-throated Vireo",   sound: "audio/Yellow-throated_Vireo.mp3" },
    { name: "Red-eyed Vireo",          sound: "audio/Red-eyed_Vireo.mp3" },
    { name: "Sandhill Crane",          sound: "audio/Sandhill_Crane.mp3" },
    { name: "House Wren",              sound: "audio/Northern_House_Wren.mp3", aliases: ["northern house wren"] },
    { name: "Killdeer",                sound: "audio/Killdeer.mp3" },
    { name: "Wood Thrush",             sound: "audio/Wood_Thrush.mp3" },
    { name: "Gray Catbird",            sound: "audio/Gray_Catbird.mp3", aliases: ["grey catbird"] },
    { name: "Yellow Warbler",          sound: "audio/Northern_Yellow_Werber.mp3" },
    { name: "Eastern Wood-Pewee",      sound: "audio/Eastern_Wood-Pewee.mp3", aliases: ["eastern wood pewee", "eastern woodpewee"] },
    { name: "Common Yellowthroat",     sound: "audio/Common_Yellowthroat.mp3" }
];

function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
}

let birds = shuffle(BIRDS);
let currentBird = 0;
let score = 0;
let total = 0;
let answered = false;
let currentAudio = null;

const $ = (id) => document.getElementById(id);

function normalize(s) {
    return s.toLowerCase().replace(/[-'’]/g, " ").replace(/\s+/g, " ").trim();
}

function renderBirdList() {
    const ul = $("birdList");
    ul.innerHTML = "";
    const sorted = BIRDS.map(b => b.name).sort();
    for (const name of sorted) {
        const li = document.createElement("li");
        li.textContent = name;
        ul.appendChild(li);
    }
}

function updateProgress() {
    const pct = total === 0 ? 0 : (total / birds.length) * 100;
    $("progressFill").style.width = pct + "%";
}

function playSound() {
    if (currentAudio) currentAudio.pause();
    currentAudio = new Audio(birds[currentBird].sound);
    currentAudio.play().catch(() => {
        $("result").textContent = "Audio failed to load.";
        $("result").className = "result wrong";
    });
}

function pauseSound() {
    if (currentAudio) currentAudio.pause();
}

function restartSound() {
    if (currentAudio) {
        currentAudio.currentTime = 0;
        currentAudio.play();
    } else {
        playSound();
    }
}

function checkAnswer() {
    if (answered) return;
    const userAnswer = normalize($("answerInput").value);
    if (!userAnswer) return;

    const bird = birds[currentBird];
    const valid = [bird.name, ...(bird.aliases || [])].map(normalize);

    total++;
    answered = true;

    const result = $("result");
    if (valid.includes(userAnswer)) {
        score++;
        result.innerHTML = '<span aria-hidden="true">✅</span> Correct! ' + bird.name;
        result.className = "result correct";
    } else {
        result.innerHTML = '<span aria-hidden="true">❌</span> Not quite — correct answer: ' + bird.name;
        result.className = "result wrong";
    }

    $("score").textContent = `Score: ${score} / ${total}`;
    updateProgress();
}

function nextBird() {
    if (currentAudio) currentAudio.pause();

    currentBird++;
    if (currentBird >= birds.length) {
        currentBird = 0;
        birds = shuffle(BIRDS);
    }

    $("birdCounter").textContent = `Bird ${currentBird + 1} of ${birds.length}`;
    $("answerInput").value = "";
    $("result").textContent = "";
    $("result").className = "result";
    answered = false;
    $("answerInput").focus();
}

$("answerInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if (answered) nextBird();
        else checkAnswer();
    }
});

renderBirdList();
$("birdCounter").textContent = `Bird ${currentBird + 1} of ${birds.length}`;
</script>

</body>
</html>
